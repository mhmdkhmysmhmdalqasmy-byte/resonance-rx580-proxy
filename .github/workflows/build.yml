#pragma comment(lib, "d3d12.lib")

using PFN_D3D12CreateDevice =
    HRESULT(WINAPI*)(IUnknown*, D3D_FEATURE_LEVEL, REFIID, void**);

using PFN_D3D12GetDebugInterface =
    HRESULT(WINAPI*)(REFIID, void**);

using PFN_D3D12GetInterface =
    HRESULT(WINAPI*)(REFCLSID, REFIID, void**);

using PFN_D3D12CreateRootSignatureDeserializer =
    HRESULT(WINAPI*)(
        LPCVOID,
        SIZE_T,
        REFIID,
        void**
    );

using PFN_D3D12CreateVersionedRootSignatureDeserializer =
    HRESULT(WINAPI*)(
        LPCVOID,
        SIZE_T,
        REFIID,
        void**
    );

using PFN_D3D12SerializeRootSignature =
    HRESULT(WINAPI*)(
        const D3D12_ROOT_SIGNATURE_DESC*,
        D3D_ROOT_SIGNATURE_VERSION,
        ID3DBlob**,
        ID3DBlob**
    );

using PFN_D3D12SerializeVersionedRootSignature =
    HRESULT(WINAPI*)(
        const D3D12_VERSIONED_ROOT_SIGNATURE_DESC*,
        ID3DBlob**,
        ID3DBlob**
    );

static HMODULE g_realD3D12 = nullptr;

static PFN_D3D12CreateDevice
    g_D3D12CreateDevice = nullptr;

static PFN_D3D12GetDebugInterface
    g_D3D12GetDebugInterface = nullptr;

static PFN_D3D12GetInterface
    g_D3D12GetInterface = nullptr;

static PFN_D3D12CreateRootSignatureDeserializer
    g_D3D12CreateRootSignatureDeserializer = nullptr;

static PFN_D3D12CreateVersionedRootSignatureDeserializer
    g_D3D12CreateVersionedRootSignatureDeserializer = nullptr;

static PFN_D3D12SerializeRootSignature
    g_D3D12SerializeRootSignature = nullptr;

static PFN_D3D12SerializeVersionedRootSignature
    g_D3D12SerializeVersionedRootSignature = nullptr;

static std::once_flag g_init;

static void Log(const char* fmt, ...)
{
    char exePath[MAX_PATH]{};

    if (!GetModuleFileNameA(nullptr, exePath, MAX_PATH))
        return;

    char* slash = strrchr(exePath, '\\');

    if (slash)
        *slash = '\0';

    char logPath[MAX_PATH]{};

    wsprintfA(
        logPath,
        "%s\\Resonance_RX580_CustomFix.log",
        exePath
    );

    FILE* file = nullptr;

    fopen_s(&file, logPath, "a");

    if (!file)
        return;

    SYSTEMTIME st{};
    GetLocalTime(&st);

    fprintf(
        file,
        "[%02u:%02u:%02u.%03u] ",
        st.wHour,
        st.wMinute,
        st.wSecond,
        st.wMilliseconds
    );

    va_list args;
    va_start(args, fmt);

    vfprintf(file, fmt, args);

    va_end(args);

    fprintf(file, "\n");

    fclose(file);
}

static FARPROC GetRealProc(const char* name)
{
    if (!g_realD3D12)
        return nullptr;

    return GetProcAddress(g_realD3D12, name);
}

static void InitRealD3D12()
{
    char systemDir[MAX_PATH]{};

    UINT len = GetSystemDirectoryA(
        systemDir,
        MAX_PATH
    );

    if (len == 0 || len >= MAX_PATH)
    {
        Log("ERROR: GetSystemDirectoryA failed");
        return;
    }

    char path[MAX_PATH]{};

    wsprintfA(
        path,
        "%s\\d3d12.dll",
        systemDir
    );

    g_realD3D12 = LoadLibraryA(path);

    if (!g_realD3D12)
    {
        Log(
            "ERROR: cannot load system d3d12.dll, error=%lu",
            GetLastError()
        );

        return;
    }

    g_D3D12CreateDevice =
        reinterpret_cast<PFN_D3D12CreateDevice>(
            GetRealProc("D3D12CreateDevice")
        );

    g_D3D12GetDebugInterface =
        reinterpret_cast<PFN_D3D12GetDebugInterface>(
            GetRealProc("D3D12GetDebugInterface")
        );

    g_D3D12GetInterface =
        reinterpret_cast<PFN_D3D12GetInterface>(
            GetRealProc("D3D12GetInterface")
        );

    g_D3D12CreateRootSignatureDeserializer =
        reinterpret_cast<PFN_D3D12CreateRootSignatureDeserializer>(
            GetRealProc(
                "D3D12CreateRootSignatureDeserializer"
            )
        );

    g_D3D12CreateVersionedRootSignatureDeserializer =
        reinterpret_cast<
            PFN_D3D12CreateVersionedRootSignatureDeserializer
        >(
            GetRealProc(
                "D3D12CreateVersionedRootSignatureDeserializer"
            )
        );

    g_D3D12SerializeRootSignature =
        reinterpret_cast<PFN_D3D12SerializeRootSignature>(
            GetRealProc("D3D12SerializeRootSignature")
        );

    g_D3D12SerializeVersionedRootSignature =
        reinterpret_cast<
            PFN_D3D12SerializeVersionedRootSignature
        >(
            GetRealProc(
                "D3D12SerializeVersionedRootSignature"
            )
        );

    Log("=== Custom RX580 D3D12 Proxy loaded ===");
    Log("System DLL: %s", path);

    Log(
        "D3D12CreateDevice = %p",
        reinterpret_cast<void*>(g_D3D12CreateDevice)
    );

    Log(
        "D3D12GetInterface = %p",
        reinterpret_cast<void*>(g_D3D12GetInterface)
    );
}

static bool EnsureLoaded()
{
    std::call_once(
        g_init,
        InitRealD3D12
    );

    return g_D3D12CreateDevice != nullptr;
}


// ============================================================
// D3D12CreateDevice
// ============================================================

extern "C" __declspec(dllexport)
HRESULT WINAPI D3D12CreateDevice(
    IUnknown* pAdapter,
    D3D_FEATURE_LEVEL MinimumFeatureLevel,
    REFIID riid,
    void** ppDevice)
{
    if (!EnsureLoaded())
        return E_FAIL;

    Log(
        "D3D12CreateDevice requested FL=0x%X",
        static_cast<unsigned>(MinimumFeatureLevel)
    );

    /*
        RX 580 الحقيقي عندك يظهر Feature Level 12_0.

        لا نجبر التعريف على 12_1 هنا.
        نسمح للـdriver الحقيقي بإنشاء الجهاز على 12_0.
    */

    D3D_FEATURE_LEVEL actualLevel =
        MinimumFeatureLevel;

    if (actualLevel > D3D_FEATURE_LEVEL_12_0)
        actualLevel = D3D_FEATURE_LEVEL_12_0;

    HRESULT hr =
        g_D3D12CreateDevice(
            pAdapter,
            actualLevel,
            riid,
            ppDevice
        );

    Log(
        "D3D12CreateDevice actual FL=0x%X HRESULT=0x%08X",
        static_cast<unsigned>(actualLevel),
        static_cast<unsigned>(hr)
    );

    return hr;
}


